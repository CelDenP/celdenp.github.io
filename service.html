<!DOCTYPE html>

<head>

<body data-page="service" class="section-dark overflow-hidden">

    <div class="floating-nav-container container">
        <div id="headerGlass" class="glass-container glass-container--rounded glass-header-dark">
            <div class="glass-specular"></div>
            <div class="glass-content navbar justify-content-between navbar-expand-lg">
                <div class="container-fluid d-flex justify-content-between align-items-center">
                    <a class="navbar-brand fw-bold mb-0" href="index.html">ENG-TOOLS</a>
                    <button class="btn btn-sm glass-btn" onclick="window.history.back()">← Назад</button>
                </div>
            </div>
        </div>
    </div>

    <section class="service-wrapper container">
        <div class="glass-container glass-container--rounded w-100">
            <div class="glass-specular"></div>
            <div class="glass-content p-4 p-md-5 service-card-content">
                
                <div class="mb-4 border-bottom border-secondary pb-3 d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <div>
                        <h1 class="fw-bold mb-1 d-flex align-items-center gap-3">
                            <span id="item-icon">📦</span> <span id="item-name">Загрузка...</span>
                        </h1>
                    </div>
                </div>

                <div class="row mb-4 align-items-start">
                    <div class="col-lg-7">
                        <h4 class="mb-3">Описание:</h4>
                        <p class="opacity-75 lh-lg" id="item-desc" style="white-space: pre-line;">
                            Пожалуйста, подождите...
                        </p>
                    </div>
                    
                    <div class="col-lg-5 mt-4 mt-lg-0">
                        <div class="p-4 border border-secondary rounded-4 bg-white bg-opacity-10 mb-4">
                            <h5 class="mb-3 text-center border-bottom border-secondary pb-2">Информация о файле</h5>
                            <ul class="list-unstyled mb-0">
                                <li class="d-flex justify-content-between mb-2">
                                    <span class="opacity-75">Версия:</span> <strong id="item-version">-</strong>
                                </li>
                                <li class="d-flex justify-content-between mb-2">
                                    <span class="opacity-75">Размер:</span> <strong id="item-size">-</strong>
                                </li>
                            </ul>
                        </div>
                        
                        <a id="item-download" href="#" target="_blank" class="btn glass-btn w-100 py-3 fs-5 fw-bold d-flex align-items-center justify-content-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Скачать файл
                        </a>
                        <p class="text-center opacity-50 small mt-2 mb-0">Вирусов нет.</p>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
